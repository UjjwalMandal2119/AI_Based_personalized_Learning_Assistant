spring:
  application:
    name: learning-assistant
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning_assistant}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.8-flash}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
  response-timeout: ${GEMINI_RESPONSE_TIMEOUT:60s}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
